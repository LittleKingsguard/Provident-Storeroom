# `/.github/workflows/publish.yml` — **THE FIVE-ARTEFACT RELEASE MATRIX OF `U-STOREROOM-PUBLISH`**
# (`docs/specs/storeroom-publish/release.md §1`; `docs/specs/storeroom-publish/contract.md §3.1`; `PUB-DD-7`;
# `PUB-DD-23`; `Q3-5`).
#
# **WHAT THIS FILE IS: the CI INPUTS landed as a workflow — the five per-target runners, the tag/version
# rule, the tag's actor, the provenance subject and the SIX STEPS IN THE DECLARED ORDER, of which the
# LOAD-BEARING property is that the MAIN PACKAGE IS PUBLISHED LAST, ALWAYS** (`release.md §1.4` step 5;
# `§3.1`). **The order is the partial-publish arm's own precondition: a failure before the main package is
# recovered IN PLACE on the same version, because nothing a consumer can install is yet incomplete.**
#
# **NO PASS OF THIS UNIT PUBLISHES, PACKS, TAGS, INSTALLS OR ATTESTS** (`release.md §4.1` item 1): this
# file DECLARES what the release must satisfy and is executed by NOTHING in this repository. **The release
# acts are the ARCHITECT'S** (`release.md §1.3` item 1: the tag's actor is the architect) — the tag he
# creates is this workflow's only trigger, and the publication is his act's consequence.
#
# **NO TRACKED BYTE HERE CARRIES A REGISTRY TOKEN, A SECRET OR A CREDENTIAL** (`release.md §1.4`'s closing
# prohibition; `contract.md §2.5` item 4): the publish steps authenticate through the host's own OIDC
# federation and through the repository's own trusted-publishing configuration, and NO `secrets.*`
# reference and no auth token is written into this file. **NOTHING IS PUBLISHED FROM AN UNTAGGED COMMIT**
# (`release.md §2.1` item 3): the only trigger below is the tag's own push, whose form is
# `v<major>.<minor>.<patch>`.

name: publish

# `release.md §2.1` items 1–3 — **VERSION EQUALS TAG, AND ONLY THE TAG PUBLISHES.** A branch head, a pull
# request and a manual dispatch publish nothing: there is no `branches:`, no `pull_request:` and no
# `workflow_dispatch:` trigger, so an untagged commit has no route to the registry at all.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# `release.md §1.3` items 2–3; `§1.4` step 6 — **THE PROVENANCE SUBJECT IS THE TAGGED COMMIT OF THIS
# REPOSITORY**, recorded as the attestation's subject. `id-token: write` is the host's OIDC federation and
# is not a credential written into this file; `contents: read` is the whole of the rest of the access.
permissions:
  contents: read
  id-token: write

jobs:
  # `release.md §1.2` — **ONE RUNNER PER TARGET, AND NO RUNNER SERVES TWO.** Each runner builds ITS OWN
  # target and no other, because a cross-compiled artefact would make *"a consumer on a covered target
  # needs no Rust toolchain"* a claim about a build this matrix did not perform. The five names are the
  # five declared scoped names of `resolution.md §3.1`, name for name — **each carrying the PROJECT token
  # `provident-storeroom` beside the language marker `js-`, because the scope `@auspicion` serves more than
  # one project (`A88`(a))**.
  platform:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            name: '@auspicion/provident-storeroom-js-linux-x64-gnu'
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            name: '@auspicion/provident-storeroom-js-linux-arm64-gnu'
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: darwin-x64
            name: '@auspicion/provident-storeroom-js-darwin-x64'
            runner: macos-13
            target: x86_64-apple-darwin
          - label: darwin-arm64
            name: '@auspicion/provident-storeroom-js-darwin-arm64'
            runner: macos-14
            target: aarch64-apple-darwin
          - label: win32-x64
            name: '@auspicion/provident-storeroom-js-win32-x64-msvc'
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      # `release.md §1.4` step 1 — **BUILD**, whose precondition is the tagged commit checked out. The
      # ref is the tag itself and never a branch, so the bytes this matrix builds have the tag's identity.
      - name: '1. checkout the tagged commit'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: '1. install the Rust toolchain for this target'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # **⟶ THE PUBLISHING CLIENT, INSTALLED WITH THE TOOLCHAIN AND BEFORE THE BUILD — CAUSE 2 OF THE
      # RELEASE'S FAILURE, AND ITS FIX.**
      # **THE DIAGNOSIS, FROM THE RUN'S OWN LOG, VERBATIM:**
      #   `npm error code ENEEDAUTH`
      #   `npm error need auth This command requires you to be logged in to https://registry.npmjs.org/`
      # **— WHILE THE TARBALL WAS ASSEMBLED CORRECTLY, `4` FILES, MATCHING THE LOCAL DRY RUN TO THE TENTH OF
      # A KILOBYTE.** **The registry's trusted-publisher configuration is not the fault: the CLIENT is too
      # old. Trusted publishing needs `npm >= 11.5.1`, and this workflow had NO `setup-node` step at all, so
      # `npm` was the runner image's own — Node 20's `npm 10.x`, which PREDATES THE FEATURE and therefore
      # reports exactly what a machine with no credentials reports.**
      # **WHAT THIS STEP DOES NOT DO, STATED SO THE DECLARED DESIGN IS NOT READ AS WIDENED: IT SETS NO AUTH
      # TOKEN VARIABLE AND IT REFERENCES NO REPOSITORY SECRET — not one byte of that vocabulary is written
      # below, so this file's own head claim stands to a `grep`.** Trusted publishing authenticates by the
      # host's OIDC federation, which the `id-token: write` permission below already grants; a token would
      # contradict this file's own declared design. **`registry-url` is the registry's ADDRESS and not a
      # credential, and `npm` loads it with the placeholder the step writes left unset — measured on this
      # machine at `npm 12.2.0`: a project `.npmrc` carrying setup-node's own auth line, its token
      # environment variable UNSET, loads at exit `0` (`npm config list`); and the documented npm example for
      # trusted publishing carries the same `registry-url` beside *"Publish uses OIDC - no token needed"*.**
      # **POSITION: the platform job's toolchain pair — Rust for the target, then the Node whose npm performs
      # the exchange — placed BEFORE the build because the Windows leg's own test binary links the Node
      # import library `bindings/js/build.rs` fetches and runs under a `node.exe` on `PATH`.**
      # **AND ONE THING THIS FILE CANNOT SEE, LEFT TO THE ARCHITECT RATHER THAN GUESSED: if the registry's
      # per-package trusted-publisher configuration NAMES AN ENVIRONMENT, the job must declare
      # `environment: <name>` or the exchange is refused with this same `ENEEDAUTH`. No name is invented
      # here.** **AND THE COST, DECLARED RATHER THAN HIDDEN: `docs/specs/storeroom-publish/release.md §5.2`
      # item `1` and `docs/specs/storeroom-publish/contract.md §5.2` item `1` print that this file carries
      # NO `setup-node` and NO `registry-url`; BOTH CELLS MOVE BY THIS STEP AND ARE REPORTED TO THE
      # SPECWRITER RATHER THAN EDITED HERE** (a contract edit is not the build's act; `§0.3`'s reversal
      # instrument is the supervisor's).
      - name: 'precondition: the publishing client — Node 24, whose npm performs the OIDC exchange'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # `release.md §1.4` step 1's second half — **THE SIBLING CRATE'S OWN `cargo test`, ON AT LEAST THE
      # HOST TARGET** — run from the repository root, at the crate's own manifest, offline as every leg of
      # this project is (`contract.md §4.5` item 2).
      - name: '1. cargo test the sibling crate (host target)'
        run: cargo test --manifest-path bindings/js/Cargo.toml --offline --no-fail-fast

      - name: '1. build the sibling crate for this target'
        run: cargo build --release --manifest-path bindings/js/Cargo.toml --offline --target ${{ matrix.target }}

      # `release.md §1.4` step 2 — **ASSEMBLE** each platform artefact's published content: its manifest
      # (the tracked one below, whose `version` equals the main package's, character for character), its
      # `.node` for the target, and the licence copy. **NO BINARY IS EVER COMMITTED** (`distribution.md
      # §3.1`): the directories below are tracked carrying their manifest and nothing a build produces,
      # and this step is what places the built artefact beside the manifest at CI time.
      - name: '2. assemble the platform artefact (manifest, .node, licence copy)'
        shell: bash
        run: |
          set -euo pipefail
          label='${{ matrix.label }}'
          dir="bindings/js/platforms/$label"
          case '${{ runner.os }}' in
            Windows) built="bindings/js/target/${{ matrix.target }}/release/storeroom_js_binding.dll" ;;
            macOS)   built="bindings/js/target/${{ matrix.target }}/release/libstoreroom_js_binding.dylib" ;;
            *)       built="bindings/js/target/${{ matrix.target }}/release/libstoreroom_js_binding.so" ;;
          esac
          cp "$built" "$dir/storeroom_js_binding.node"
          cp LICENSE "$dir/LICENSE"
          node -e "const m=require('./$dir/package.json');const main=require('./bindings/js/package.json');if(m.version!==main.version){throw new Error('release.md §2.2: '+m.name+' version '+m.version+' differs from the main package version '+main.version)}"

      # **`A89`(4) / `docs/specs/storeroom-publish-proposal.md §15` — THE PLATFORM SITE'S PRE-PUBLISH
      # EXISTENCE GUARD, AND WHY IT IS HERE: `npm` OMITS A MISSING `files` ENTRY **SILENTLY**, which is the
      # property that let `0.1.0`'s five platform tarballs publish GREEN while holding `README.md` and
      # `package.json` alone — their own `files` arrays named a `.node` and a `LICENSE` and NEITHER EXISTED,
      # and the emptiness was invisible until it was queried at the registry.** **SO THE GUARD ASSERTS THE
      # PATHS THIS MANIFEST ITSELF NAMES — its `main` and every one of its `files` entries — read FROM the
      # manifest rather than re-spelled here, so a manifest edit cannot outrun its own check; `test -e` on
      # each, and the step FAILS LOUDLY before the name and the version are spent** (`PUB-DD-27`'s price: a
      # bootstrap that skipped the assembly shipped a `package.json` and a `README.md` alone).
      - name: '4. guard: the manifest''s own paths exist before the publish'
        shell: bash
        run: |
          set -euo pipefail
          dir="bindings/js/platforms/${{ matrix.label }}"
          paths=$(node -e "const m=require('./$dir/package.json');const p=[m.main,(m.files||[])].flat().filter((x)=>typeof x==='string');if(p.length===0){throw new Error('A89(4): the manifest names no path to check')}process.stdout.write([...new Set(p)].join('\n'))")
          while IFS= read -r path; do
            test -e "$dir/$path" || { echo "A89(4): the manifest $dir/package.json names '$path' and it does not exist — npm omits a missing files entry SILENTLY, which is how 0.1.0's empty platform tarballs published green"; exit 1; }
          done <<< "$paths"

      # `release.md §1.4` step 4 — **PUBLISH THE FIVE PLATFORM ARTEFACTS**, before the main package, at the
      # tag's own version. The step is a registry publication and is the ARCHITECT'S act's arm: it is
      # reached only from a tag, and the scope `@auspicion` is owned before the first platform
      # publish (`PUB-DD-6`'s precondition; `A86`(a)).
      - name: '4. publish the platform artefact'
        shell: bash
        run: |
          set -euo pipefail
          cd "bindings/js/platforms/${{ matrix.label }}"
          npm publish --access public --provenance

      # `release.md §1.4` step 4's own closing half / `distribution.md §3.1` item 2 — **THE ASSEMBLED BYTES DO
      # NOT OUTLIVE THE STEP THAT NEEDED THEM.** The licence copy `cp LICENSE "$dir/LICENSE"` placed at step
      # 2 and the `.node` `cp "$built" "$dir/storeroom_js_binding.node"` placed beside it are REMOVED here,
      # after the publish and whatever its outcome, so no byte a build produced and no licence byte persists
      # under `bindings/js/platforms/`: the tracked platform directory carries its manifest and its own
      # `README.md` and nothing else (`distribution.md §3.1`: *"NO BINARY IS EVER COMMITTED TO THE TRACKED
      # TREE"*), and the copy is an ARTEFACT-LEVEL fact rather than a crate-level file (`§2.3` item 2;
      # `distribution.md §4.3` item 2; `Q3-5`).
      - name: '4. remove the assembled licence copy and binary after the publish'
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "bindings/js/platforms/${{ matrix.label }}/LICENSE" \
                "bindings/js/platforms/${{ matrix.label }}/storeroom_js_binding.node"

  # `release.md §1.4` steps 3 and 5 — **THE MAIN PACKAGE IS PUBLISHED LAST, ALWAYS.** It waits on the whole
  # platform matrix, so its five exact pins are already resolved in the registry when it lands; and its
  # content is the entry, the shipped `README.md` and the authored `index.d.ts`, **with NO binary**
  # (`distribution.md §2.1`; `PUB-DD-1`).
  main:
    name: provident-storeroom (last, always)
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - name: '1. checkout the tagged commit'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # `release.md §1.4` step 3 — **BUILD THE MAIN PACKAGE'S CONTENT**: the entry, the shipped README and
      # the authored declaration file. **NO BINARY** enters the allowlist, so the tarball is byte-identical
      # for every publisher (`distribution.md §2.1` item 2), and the version is the tag's own.
      - name: '3. build the main package content (no binary)'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node -e "const m=require('./bindings/js/package.json');if(m.version!=='$version'){throw new Error('release.md §2.1: the tag is v'+'$version'+' and the manifest declares '+m.version)}"
          node -e "const m=require('./bindings/js/package.json');const pins=Object.entries(m.optionalDependencies||{});if(pins.length!==5){throw new Error('PUB-DD-10: five exact pins are required, found '+pins.length)};for(const [n,p] of pins){if(p!==m.version){throw new Error('PUB-DD-10: '+n+' is pinned '+p+' and the package is '+m.version)}}"

      # `release.md §1.4` step 3's own assembly half / `contract.md §2.3` item 2 / `distribution.md §4.3` item
      # 2 — **THE MAIN PACKAGE'S LICENCE COPY IS LANDED AT PACK TIME AND REMOVED AFTER IT.** The main
      # package's `files` allowlist is the three entries `§2.1` item 1 fixes and NOTHING ELSE, so the copy is
      # never an entry; the mechanism is the release's own assembly step, and `npm` carries a ROOT `LICENSE`
      # into the tarball REGARDLESS of `files`. The repository's own `LICENSE` is therefore copied
      # BYTE-FOR-BYTE to this package's packaging root (`bindings/js/`) IMMEDIATELY BEFORE the publish below,
      # where the tarball picks it up as the fourth published path `§2.1`'s closing clause names, and removed
      # IMMEDIATELY AFTER it. **THE COPY IS TRANSIENT AND NEVER PERSISTS**: `bindings/js/LICENSE` is REFUSED
      # as a tracked or drifting copy (`contract.md §2.3` item 4; `distribution.md §4.3` item 1; `PUB-DD-12`),
      # so the step opens with the absence it must find and the removal below restores it — and NOTHING under
      # `bindings/js/` is written by any other step of this file.
      - name: '3. land the main package''s licence copy at the packaging root (pack-time only)'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e bindings/js/LICENSE
          cp LICENSE bindings/js/LICENSE
          node -e "const fs=require('fs');if(fs.readFileSync('LICENSE','utf8')!==fs.readFileSync('bindings/js/LICENSE','utf8')){throw new Error('contract.md §2.3 item 2: the licence copy is byte-for-byte')}"

      # **`A89`(4) / `docs/specs/storeroom-publish-proposal.md §15` — THE MAIN SITE'S PRE-PUBLISH EXISTENCE
      # GUARD, and the same property as the platform site's: the tarball's FOURTH published path is the
      # pack-time licence copy above, and `npm` would carry the copy's ABSENCE into a green publish just as
      # silently — the step above asserts the copy's bytes against the repository's `LICENSE`, and THIS one
      # asserts that the path it landed at is still there AT THE PACKAGING ROOT, IMMEDIATELY BEFORE the
      # publish reads it.**
      - name: '5. guard: the pack-time licence copy exists at the packaging root before the publish'
        shell: bash
        run: |
          set -euo pipefail
          test -e bindings/js/LICENSE || { echo "A89(4): the pack-time licence copy 'bindings/js/LICENSE' is absent at the packaging root — the publish's fourth path would be omitted SILENTLY"; exit 1; }

      # **⟶ THE SAME PUBLISHING CLIENT, AT THE SECOND PUBLISH SITE — for the same diagnosed cause and with the
      # same two omissions.** The main site publishes with `npm publish` like the platform site, so it needs
      # the same floor (`npm >= 11.5.1`) to perform the OIDC exchange at all: the run's `ENEEDAUTH` was
      # reported by a client below that floor, in the job whose tarball had been assembled correctly. **NO
      # AUTH TOKEN VARIABLE AND NO REPOSITORY SECRET IS SET BESIDE IT, and the same one thing the architect
      # must confirm is owed here: whether the per-package trusted-publisher configuration names an
      # ENVIRONMENT, in which case `environment: <name>` is owed in this job too and this same `ENEEDAUTH` is
      # the symptom.** **The position is IMMEDIATELY BEFORE the publish it exists for, in a job that needs
      # Node for nothing else.**
      - name: 'precondition: the publishing client — Node 24, whose npm performs the OIDC exchange'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # `release.md §1.4` step 5 — **PUBLISH THE MAIN PACKAGE**, after all five platform artefacts.
      - name: '5. publish the main package'
        working-directory: bindings/js
        run: npm publish --access public --provenance

      # `release.md §1.4` step 5's own closing half — **THE PACK-TIME COPY IS REMOVED, WHATEVER THE PUBLISH'S
      # OUTCOME**, so no `LICENSE` byte persists under `bindings/js/` and the tracked tree is left exactly as
      # the tagged commit has it (`contract.md §2.3` item 4; `distribution.md §4.3` item 1; `PUB-DD-12`).
      - name: '5. remove the pack-time licence copy'
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f bindings/js/LICENSE
          test ! -e bindings/js/LICENSE

      # `release.md §1.4` step 6 — **ATTEST**: the provenance attestation for the tagged commit's bytes,
      # through the host's OIDC federation at the declared level of reach. **WHERE THE SOURCE REPOSITORY IS
      # NOT PUBLICLY REACHABLE THE ATTESTATION IS DECLARED-NOT-ATTESTED IN THE RECORD** (`release.md §1.3`
      # item 2): the attestation's reach is a fact the record states rather than one this file assumes.
      - name: '6. attest the tagged commit''s provenance'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'bindings/js/index.mjs'
