[package]
name = "storeroom-native"
version = "0.1.0"
edition = "2021"
description = "The native Rust store for Provident-Storeroom (U-STOREROOM-NATIVE): the record shapes, the walk, the three verbs, the tiers and purge, the journal and rollback, and the store's own persistence"
license = "GPL-3.0-or-later"

# The Rust import path is `storeroom_native` (contract §0.4): the package id may be hyphenated and the
# library target's name is the package name with `-` mapped to `_`, so `use storeroom_native::...`
# reaches every surface item re-exported from the crate root.
#
# ⟶ 2026-10-21 — THIS CRATE MAY CARRY REGISTRY DEPENDENCIES. The JS-side-only "no dependency"
# constraint that stood here is ARCHIVED — see
# `archive/spec-history/2026-10-21-dependency-restriction-notes-move-out.md` §1. `--offline` remains
# the store's declared build form (a command property), and a cold build must fetch once.
[dependencies]
# `serde` carries the two trait impls — `Serialize` in `src/json.rs`, `Deserialize` in `src/value.rs` — and
# `serde_json` is the codec itself. Neither is derived: both impls are hand-written, because the declared
# image needs control the derives do not give (the canonical number spelling, and keeping the `§1.4`
# outside classes unreachable from text).
#
# **`float_roundtrip` IS NOT OPTIONAL AND IS NOT A PERFORMANCE CHOICE — IT IS A CORRECTNESS ONE.** The
# canonical spelling of `seams-and-lifecycle.md §7.2` item 7(a) is the SHORTEST DECIMAL THAT PARSES BACK TO
# THE SAME `f64`, and that rule is the READ side as well as the write side (item 7(b): *"any finite JSON
# number spelling a parser admits is ACCEPTED at the boot"*). Without this feature `serde_json`'s fast float
# path REFUSES a long decimal expansion as `NumberOutOfRange` once it overflows to infinity — `f64::MAX`'s
# own canonical spelling is 309 digits and is one such expansion — so a `file`-tier state holding
# `f64::MAX` WROTE bytes the decoder could not read back, and `boot_load`'s no-load fall-through SILENTLY
# DISCARDED THE WHOLE FILE. With the feature every canonical spelling round-trips to the identical `f64`,
# `f64::MAX` and `f64::MIN_POSITIVE` included. Measured: `cargo test` at the root is `395` pass / `0` fail
# both ways, so this feature is what makes the swap byte- and state-preserving rather than a silent loss.
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[lib]
name = "storeroom_native"
path = "src/lib.rs"

# =====================================================================================================
# THE WORKSPACE — AND IT IS THE ONE ROOT THE THREE PACKAGES SHARE
# =====================================================================================================
#
# **BEFORE THIS, THE ROOT MANIFEST CARRIED NO `[workspace]` AND THE SIBLING CRATE DECLARED NONE**
# (`package.md §4.1` item 2: *"It is NOT a workspace member"*). `D-34` **LIFTED THAT REQUIREMENT AND NOT THE
# CRATE'S DESIGN**: `bindings/js` stays its own package with `crate-type = ["cdylib", "rlib"]` and ONE path
# dependency on the store — it is a MEMBER now, which is a statement about the tree and not about the crate.
#
# **THE THREE MEMBERS AND THE TWO DEFAULTS.** `.` is the store (`storeroom-native`), `bindings/js` is the
# sibling crate (`storeroom-js-binding`), and `tests` is the non-published battery package
# (`storeroom-tests`) that hosts the binding crate's six targets. `default-members` is `[".", "tests"]` —
# the two packages that carry Rust cells — so that a bare `cargo test` at this root runs BOTH of them and
# neither is left un-run by a default that named the store's package alone.
#
# **AND THE THREE DECLARED LEGS FOLLOW FROM THAT, EACH PACKAGE-SCOPED:**
#   * `cargo test --offline -p storeroom-native` — THE STORE'S LEG, `415` cells;
#   * `cargo test -p storeroom-tests`            — THE BATTERY'S LEG, `235` cells;
#   * `cargo test`                                — THE BOTH-OF-THEM COMMAND, `650` cells.
# The same three are declared in the repository's two live homes for a leg, the root `package.json`'s
# `scripts` and `bindings/js/README.md`'s `Tests` section. **`-p` IS NOT DECORATION ON THE BUILD SIDE**: a
# workspace-root `cargo build --offline` would pull the sibling crate's `napi` crates and `--offline` would
# refuse them, which is why the root manifest's `scripts.build` names the store by package.
#
# **THE FOURTEEN TARGETS DECLARED BELOW ARE THE STORE'S OWN, AND THEY STAY WITH THE STORE'S PACKAGE ON
# PURPOSE.** `docs/L1/test-stratification.json` moves their FILES to `tests/integration/**`, and a target
# under an extra directory level is invisible to cargo's test auto-discovery (`tests/*.rs` and
# `tests/*/main.rs` only) — so each one is named here, by name and path. The SIX files that remain are the
# sibling crate's, and they are named at `tests/Cargo.toml`, where the package that hosts them lives.
# **`14 + 6 = 20` targets, and the split is what keeps `-p storeroom-native` naming `415` cells and
# `-p storeroom-tests` naming `235` instead of both naming the same `650` or one naming nothing.**
[workspace]
members = [".", "bindings/js", "tests"]
default-members = [".", "tests"]

